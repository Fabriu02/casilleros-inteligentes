<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - UGD Smart Lockers</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; text-align: center; padding-top: 100px; }
        .login-box { border: 1px solid #ccc; padding: 30px; width: 300px; margin: auto; border-radius: 10px; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 95%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #004494; }
        .error { color: #c0392b; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Iniciar Sesión</h2>

    <!-- Aquí aparece el error si escriben mal la clave -->
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form action="/login" method="post">
        <input type="email" name="email" placeholder="Correo electrónico" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
    </form>
</div>
</body>
</html>
