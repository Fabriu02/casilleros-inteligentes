<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion casilleros</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; text-align: center; }
        h1 { color: #2c3e50; margin-top: 30px; }
        .grid-casilleros { display: flex; justify-content: center; gap: 20px; margin-top: 40px; flex-wrap: wrap; }
        .casillero {
            width: 170px; min-height: 200px; border-radius: 10px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); transition: transform 0.2s; padding: 10px;
        }
        .casillero h2 { margin: 0; font-size: 40px; }
        .casillero p { margin: 5px 0 10px 0; font-size: 14px; letter-spacing: 1px; }

        .bg-libre { background-color: #27ae60; }
        .bg-ocupado { background-color: #c0392b; }

        .form-reserva input { width: 120px; text-align: center; margin-bottom: 8px; padding: 5px; border: none; border-radius: 4px; font-weight: bold; }
        .form-reserva button { background-color: white; color: #27ae60; font-weight: bold; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer; }
        .form-reserva button:hover { background-color: #f1f1f1; }
        
        .error-msg { background-color: #ffcccc; color: #c0392b; padding: 10px; border-radius: 5px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>

<h1 th:text="${titulo}">Panel de Gestión</h1>
<p>¡Hola, <span th:text="${nombreUsuario}" style="font-weight:bold; color:#0056b3;">Usuario</span>! (<span th:text="${rolUsuario}"></span>)</p>

<p th:if="${error}" class="error-msg" th:text="${error}"></p>

<div class="grid-casilleros">
    <!-- Verificamos si es 0 (LIBRE) o 1 (OCUPADO) -->
    <div th:each="c : ${casilleros}" class="casillero" th:classappend="${c.estado == 0 ? 'bg-libre' : 'bg-ocupado'}">

        <h2>#<span th:text="${c.numero}">1</span></h2>
        <!-- Traducimos el número a texto visualmente -->
        <p th:text="${c.estado == 0 ? 'LIBRE' : 'OCUPADO'}">ESTADO</p>

        <!-- SI ESTÁ OCUPADO (1) -->
        <div th:if="${c.estado == 1}">
            <p style="font-size: 11px; margin:0;">Desde: <br><span th:text="${c.ocupadoDesde}"></span></p>
            <p th:if="${rolUsuario == 'ADMIN'}" style="font-size: 11px; color:#ffd700; margin-top:5px;">Por: <span th:text="${c.ocupadoPor}"></span></p>
            
            <!-- Botón Liberar -->
            <form th:if="${rolUsuario == 'ADMIN' or c.ocupadoPorId == usuarioIdLogueado}" action="/liberar" method="post" style="margin-top: 10px;">
                <input type="hidden" name="casilleroId" th:value="${c.id}">
                <button type="submit" style="background: white; color: #c0392b; border: none; padding: 4px; border-radius: 3px; cursor: pointer; font-size:11px; font-weight:bold;">
                    <span th:text="${rolUsuario == 'ADMIN' ? 'Forzar Liberación' : 'Liberar mi casillero'}">Liberar</span>
                </button>
            </form>
        </div>

        <!-- SI ESTÁ LIBRE (0) -->
        <form th:if="${c.estado == 0}" class="form-reserva" action="/reservar" method="post">
            <input type="hidden" name="casilleroId" th:value="${c.id}">
            <input type="text" name="pin" placeholder="PIN (4 núm)" required pattern="\d{4}" title="Debe contener exactamente 4 números">
            <button type="submit">Reservar</button>
        </form>

    </div>
</div>

<br><br>
<a href="/logout" style="color: #c0392b; text-decoration: none; font-weight: bold; border: 1px solid #c0392b; padding: 8px 15px; border-radius: 5px;">Cerrar Sesión</a>

</body>
</html>
